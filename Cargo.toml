[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# internal
silvercraft-imgproc = { path = "crates/imgproc" }
silvercraft-film = { path = "crates/film" }
silvercraft-handoff = { path = "crates/handoff" }
silvercraft-decode = { path = "crates/decode" }
silvercraft-config = { path = "crates/config" }
silvercraft-usb = { path = "crates/usb" }
silvercraft-ptp = { path = "crates/ptp" }
silvercraft-epson = { path = "crates/epson" }
silvercraft-heal = { path = "crates/heal" }
silvercraft-scanfix = { path = "crates/scanfix" }
silvercraft-detect = { path = "crates/detect" }
silvercraft-engine = { path = "crates/engine" }
silvercraft-ui-egui = { path = "crates/ui-egui" }

# LightCraft (sibling checkout at ../lightcraft; revision pinned in siblings.json)
lightcraft-raw = { path = "../lightcraft/crates/raw", default-features = false }
lightcraft-color = { path = "../lightcraft/crates/color" }
lightcraft-meta = { path = "../lightcraft/crates/meta" }
lightcraft-tiff = { path = "../lightcraft/crates/tiff" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"
log = "0.4"
rayon = "1"
proptest = "1"

# usb
nusb = "0.2"

# codecs
tiff = "0.11"
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86", "neon"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
debug = "line-tables-only"
