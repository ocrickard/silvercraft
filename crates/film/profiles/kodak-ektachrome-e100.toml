character_notes = "Moderate for a slide — mean mid-scale gradient ~1.9; 'low contrast tone scale' [datasheet]. Curves near-coincident through mid-scale (matched color records); B highest Dmax, R lowest (B 3.7 / G 3.6 / R 3.25) -> slight warm-shadow bias, milder than Velvia. Dmin 0.1-0.2 at logE ~0.0. Useful span D 0.2->3.0 ~ 2.3 log lux·s. Neutral by design; slight cool/blue shadow cast reported by reviewers."
