[characterization]
character_notes = "HIGH contrast — effective mid-scale gamma ~2.6+ (delta-D ~3.3 over delta-logH ~1.25). SIGNATURE: R (cyan dye) Dmax ~3.4 vs B/G ~3.75-3.8, a ~0.35-0.4 gap -> inherently warm/red-biased deep shadows that no global WB removes without unbalancing mids; mid-scale curves near-coincident (neutral mids). Dmin 0.05-0.1 all layers, reached ~ logH +0.4, flat to +1.0. 'World's highest level of image color saturation and vibrancy' [datasheet]; warm-leaning; long exposures go green (magenta CC per reciprocity table)."
