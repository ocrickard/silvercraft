character_notes = "Single-layer silver B&W on Kodak's ABSOLUTE log lux·s axis (density basis is diffuse visual, not Status M). Development-dependent contrast: normal = CI 0.56; CI rises ~+0.05-0.07/min in the 5-12 min range (CI 0.8-1.0 at ~10-17 min depending on developer); 11-min curve reaches D ~2.9-3.0 at logE ~+0.2; D-76 large-tank family also published. Base+fog ~0.3, flat below logE ~-3.3; very clear base. RMS 17 measured on a previous coating generation (Tri-X 320: RMS 16)."
