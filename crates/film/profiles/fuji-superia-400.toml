character_notes = "Contrastier consumer curve (vs Pro 400H); curve end at logH +0.2: B 2.85 / G 2.5 / R 2.05. Layer offsets B-G ~0.3, G-R ~0.3-0.35 logH with parallel mid-slopes — smaller offsets than Kodak stocks; toe floors diverge per layer. No D1->2 mid gradients digitized (field omitted). The 2003 generation (AF3-151E) HAS the 4th cyan color layer for fluorescent/mixed light; the 2006 generation profiled here does NOT. Slight green bias reported; green-shadow / teal-gray channel coupling. Discontinued 2024."
