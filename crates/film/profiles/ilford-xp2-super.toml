character_notes = "Chromogenic C-41 dye image (no silver); single layer. Long swept shoulder reaching D ~1.85-1.9 at rel logE ~4.1-4.3; highlight compression is intrinsic. Overexposure produces FINER grain (opposite of conventional film); no RMS published. Pink/red-brown base tint (residual sensitizing dye, harmless) must be neutralized when scanning; Digital ICE works. Usable EI 50-800 with unmodified C-41."
