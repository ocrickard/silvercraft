character_notes = "LOW contrast portrait emulsion — visibly flatter than Superia at the same speed (D ~2.0-2.6 only at logH +0.7); no D1->2 mid gradients digitized (field omitted). Layer offsets B-G ~0.4, G-R ~0.4-0.5 logH, roughly parallel mid-scale. 4th cyan-sensitive layer (~500-520 nm) for natural color under fluorescent/mixed light. Manufacturer-documented restrained shadow saturation ('appropriately controlled color saturation in the shadows'). Prone to green or pink casts in scanning unless corrected. No gray-card scan aim in this datasheet edition (field omitted). Discontinued Jan 2021."
